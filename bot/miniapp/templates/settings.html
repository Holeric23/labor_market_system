{% extends 'base.html' %}{% block title %}Настройки{% endblock %}{% block content %}
<h1>Настройки</h1><section class="panel"><form method="post" action="/settings"><input type="hidden" name="csrf" value="{{ session.csrf }}"><input type="hidden" name="revision" value="{{ settings.revision }}"><label>Ссылка на менеджера<input type="url" name="manager_url" value="{{ settings.manager_url or '' }}" placeholder="https://t.me/username"></label><label>Срок выдачи по умолчанию, дней<input type="number" name="default_access_days" min="1" max="3650" value="{{ settings.default_access_days }}" required></label><button>Сохранить</button></form></section>{% endblock %}
