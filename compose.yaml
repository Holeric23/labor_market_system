name: labor-market-system

services:
  database:
    image: postgres:17.6-alpine3.22
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20

  bot:
    image: labor-market-system-bot:local
    build:
      context: .
      dockerfile: Dockerfile.bot
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
      parser:
        condition: service_started
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      BOT_ENABLED: ${BOT_ENABLED:-false}
      BOT_TOKEN: ${BOT_TOKEN:-}
      OWNER_TELEGRAM_IDS: ${OWNER_TELEGRAM_IDS:-}
      ADMIN_MINIAPP_URL: ${ADMIN_MINIAPP_URL:-}
      ADMIN_ALLOWED_HOSTS: ${ADMIN_ALLOWED_HOSTS:-localhost,127.0.0.1}
      TRUSTED_PROXY_IP: ${TRUSTED_PROXY_IP:-127.0.0.1}
    ports:
      - "127.0.0.1:${ADMIN_PORT:-8000}:8000"

  parser:
    image: labor-market-system-parser:local
    restart: unless-stopped
    command: ["--worker"]
    build:
      context: .
      dockerfile: Dockerfile.parser
    depends_on:
      database:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
    volumes:
      - ./parsers/models:/app/parsers/models:ro
      - ./state:/app/state
      - ./.artifacts:/app/.artifacts
